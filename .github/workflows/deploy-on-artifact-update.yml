name: Deploy on Artifact Update

on:
  schedule:
    - cron: '10 6,18 * * *'  # 6:10 AM & 6:10 PM ET (after artifact updates)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch artifact and build site
        run: |
          python << 'EOF'
          import requests
          import subprocess
          
          # Fetch the artifact HTML
          artifact_url = "https://claude.ai/artifact/9NAM7hucPmQJ7Nni8CMZmh"
          response = requests.get(artifact_url)
          
          if response.status_code == 200:
              # Save to temp file
              with open('/tmp/artifact.html', 'w') as f:
                  f.write(response.text)
              
              # Run build_site.py with the artifact file
              subprocess.run(['python', 'tools/build_site.py', '/tmp/artifact.html'], check=True)
          else:
              raise Exception(f"Failed to fetch artifact: {response.status_code}")
          EOF

      - name: Commit updated site
        run: |
          git config user.name "Deploy Bot"
          git config user.email "deploy-bot@convergence.local"
          git add index.html
          git commit -m "Site update: $(date +'%Y-%m-%d %H:%M UTC')" --allow-empty || true

      - name: Push to GitHub
        run: git push

      - name: Verify deployment
        run: |
          echo "✓ Site deployment complete"
          ls -lh index.html
