name: Generate Daily Graphics

on:
  schedule:
    - cron: '0 7 * * *'  # 7 AM ET daily
  workflow_dispatch:

jobs:
  generate-graphics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install
        if: hashFiles('package.json') != ''

      - name: Install Python dependencies
        run: pip install matplotlib numpy pillow

      - name: Generate graphics
        run: |
          node build_graphics.cjs || echo "Graphics build completed with warnings"

      - name: Commit graphics output
        run: |
          git config user.name "Graphics Bot"
          git config user.email "graphics-bot@convergence.local"
          git add 'graphics/' 'og-image.png' || true
          git commit -m "Daily graphics: $(date +'%Y-%m-%d')" --allow-empty || true

      - name: Push to GitHub
        run: git push

      - name: Report status
        run: |
          echo "✓ Graphics generation complete"
          ls -lh og-image.png 2>/dev/null || echo "No OG image generated"
