name: Fetch Polling Data

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'  # 2 AM, 8 AM, 2 PM, 8 PM ET
  workflow_dispatch:

jobs:
  fetch-polling:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Fetch polling data
        run: python polling/collector.py

      - name: Commit polling cache
        run: |
          git config user.name "Polling Bot"
          git config user.email "polling-bot@convergence.local"
          git add polling/cache.json
          git commit -m "Polling update: $(date +'%Y-%m-%d %H:%M UTC')" --allow-empty || true

      - name: Push to GitHub
        run: git push

      - name: Report status
        run: |
          echo "✓ Polling fetch complete"
          python -c "import json; data=json.load(open('polling/cache.json')); print(f'Sources: {len(data[\"sources\"][\"success\"])} ok, {len(data[\"sources\"][\"failed\"])} failed')"
