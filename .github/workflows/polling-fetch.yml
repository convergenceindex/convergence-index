name: Fetch Polling Data

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'  # 2 AM, 8 AM, 2 PM, 8 PM ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-polling:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Fetch polling data
        run: python polling/collector.py

      - name: Configure git
        run: |
          git config user.name "Polling Bot"
          git config user.email "polling-bot@convergence.local"

      - name: Commit and push polling cache
        run: |
          if [ -f polling/cache.json ]; then
            git add polling/cache.json
            git commit -m "Polling update: $(date +'%Y-%m-%d %H:%M UTC')" --allow-empty || true
            git push
          fi

      - name: Report status
        run: echo "✓ Polling fetch complete"
